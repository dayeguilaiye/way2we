<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>way2we Registration Screen</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec8451",
                        "background-light": "#f8f6f6",
                        "background-dark": "#211611",
                        "text-main": "#181311",
                        "text-muted": "#886f63",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        /* Custom scrollbar hiding for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="font-display bg-background-light dark:bg-background-dark text-text-main dark:text-white antialiased selection:bg-primary/20">
    <div
        class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-2xl">
        <!-- Top Navigation -->
        <div class="flex items-center p-4 pb-2 justify-between">
            <button
                class="flex size-10 shrink-0 items-center justify-center rounded-full bg-white dark:bg-[#2A201C] shadow-sm hover:bg-gray-50 dark:hover:bg-[#352924] transition-colors text-text-main dark:text-white">
                <span class="material-symbols-outlined text-[24px]">arrow_back</span>
            </button>
            <div class="text-sm font-semibold text-text-muted dark:text-gray-400">Step 1 of 3</div>
            <div class="w-10"></div> <!-- Spacer for centering -->
        </div>
        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto no-scrollbar px-6 pb-8">
            <!-- Hero / Illustration -->
            <div class="flex justify-center pt-4 pb-6">
                <div
                    class="relative w-40 h-40 rounded-full bg-gradient-to-tr from-primary/10 to-primary/30 flex items-center justify-center overflow-hidden">
                    <div class="absolute inset-0 bg-white/40 dark:bg-black/10 backdrop-blur-sm z-0"></div>
                    <img alt="abstract warm connecting shapes representing relationship"
                        class="w-full h-full object-cover opacity-90 mix-blend-overlay z-10"
                        data-alt="abstract warm connecting shapes representing relationship"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuDDDc7Dpwb79pjI_cnXKX0tQ6ozGIxIRpSr_39TBA6EigpTvBTybFu-Fnz3zuFUev8I4Z46pEA0L5kZMMlVn3GR1jSHTArSpOWE-9VsRer5ZlvScgBOMvcJKI2LRWSHxrLmtfX8AnAYyDNKXAERe2EQxnqR_KzQkvJd-VzXcH1-j-Dk9y5rLJKeq8Q6T-f87CIlY2zSWACq8VJGpGMacP3BZBFapm5hMWWirRxvpQmhERGKx7bqwh-muK4nrVwz06kai_ObGdjxkLVC" />
                    <div
                        class="absolute z-20 bg-white dark:bg-[#2A201C] p-3 rounded-2xl shadow-lg transform rotate-6 translate-y-2">
                        <span class="material-symbols-outlined text-primary text-[32px]">favorite</span>
                    </div>
                    <div
                        class="absolute z-20 bg-white dark:bg-[#2A201C] p-2 rounded-xl shadow-lg transform -rotate-12 -translate-x-8 -translate-y-4">
                        <span class="material-symbols-outlined text-primary text-[24px]">handshake</span>
                    </div>
                </div>
            </div>
            <!-- Headline -->
            <div class="text-center mb-6">
                <h1 class="text-3xl font-extrabold tracking-tight text-text-main dark:text-white mb-2">Create your
                    shared space</h1>
                <p class="text-text-muted dark:text-gray-400 text-base leading-relaxed">Start tracking moments that
                    matter together.</p>
            </div>
            <!-- Segmented Control -->
            <div class="mb-8">
                <div class="flex p-1 bg-[#EBE8E6] dark:bg-[#2A201C] rounded-full relative">
                    <div
                        class="w-1/2 h-10 absolute left-1 top-1 bg-white dark:bg-[#3D2E28] rounded-full shadow-sm transition-all duration-300 ease-in-out">
                    </div>
                    <button
                        class="flex-1 relative z-10 h-10 flex items-center justify-center text-sm font-bold text-primary transition-colors">
                        Register
                    </button>
                    <button
                        class="flex-1 relative z-10 h-10 flex items-center justify-center text-sm font-medium text-text-muted dark:text-gray-400 hover:text-primary transition-colors">
                        Log In
                    </button>
                </div>
            </div>
            <!-- Registration Form -->
            <form class="space-y-4" onsubmit="event.preventDefault()">
                <!-- Nickname Input -->
                <div class="group relative">
                    <label
                        class="block text-xs font-bold text-text-muted dark:text-gray-400 uppercase tracking-wide mb-1.5 ml-4">Nickname</label>
                    <div class="relative">
                        <input
                            class="w-full bg-white dark:bg-[#2A201C] text-text-main dark:text-white rounded-full py-4 pl-12 pr-4 border-2 border-transparent focus:border-primary/50 focus:ring-0 focus:bg-white dark:focus:bg-[#352924] shadow-sm placeholder:text-gray-400 text-base transition-all duration-200 outline-none hover:shadow-md"
                            placeholder="What should we call you?" type="text" />
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-muted dark:text-gray-500 text-[20px]">badge</span>
                    </div>
                </div>
                <!-- Email Input -->
                <div class="group relative">
                    <label
                        class="block text-xs font-bold text-text-muted dark:text-gray-400 uppercase tracking-wide mb-1.5 ml-4">Email
                        or Phone</label>
                    <div class="relative">
                        <input
                            class="w-full bg-white dark:bg-[#2A201C] text-text-main dark:text-white rounded-full py-4 pl-12 pr-4 border-2 border-transparent focus:border-primary/50 focus:ring-0 focus:bg-white dark:focus:bg-[#352924] shadow-sm placeholder:text-gray-400 text-base transition-all duration-200 outline-none hover:shadow-md"
                            placeholder="name@example.com" type="email" />
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-muted dark:text-gray-500 text-[20px]">mail</span>
                    </div>
                </div>
                <!-- Password Input -->
                <div class="group relative">
                    <label
                        class="block text-xs font-bold text-text-muted dark:text-gray-400 uppercase tracking-wide mb-1.5 ml-4">Password</label>
                    <div class="relative">
                        <input
                            class="w-full bg-white dark:bg-[#2A201C] text-text-main dark:text-white rounded-full py-4 pl-12 pr-12 border-2 border-transparent focus:border-primary/50 focus:ring-0 focus:bg-white dark:focus:bg-[#352924] shadow-sm placeholder:text-gray-400 text-base transition-all duration-200 outline-none hover:shadow-md"
                            placeholder="••••••••" type="password" />
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-muted dark:text-gray-500 text-[20px]">lock</span>
                        <button
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-text-muted dark:text-gray-500 hover:text-primary transition-colors"
                            type="button">
                            <span class="material-symbols-outlined text-[20px]">visibility_off</span>
                        </button>
                    </div>
                </div>
                <!-- Primary Action -->
                <div class="pt-4">
                    <button
                        class="w-full bg-primary hover:bg-[#d97544] text-white font-bold py-4 rounded-full shadow-lg shadow-primary/30 transform active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2">
                        Create Account
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
                    </button>
                </div>
            </form>
            <!-- Divider -->
            <div class="flex items-center gap-4 my-8">
                <div class="h-px bg-gray-200 dark:bg-gray-700 flex-1"></div>
                <span class="text-xs font-medium text-text-muted dark:text-gray-500 uppercase">Or continue with</span>
                <div class="h-px bg-gray-200 dark:bg-gray-700 flex-1"></div>
            </div>
            <!-- Secondary Actions -->
            <div class="space-y-4">
                <button
                    class="w-full bg-transparent border-2 border-primary/20 hover:border-primary/50 text-primary font-bold py-3.5 rounded-full transform active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 group">
                    <span
                        class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">qr_code_scanner</span>
                    Join with Invite Code
                </button>
                <!-- Social Row -->
                <div class="flex justify-center gap-4">
                    <button
                        class="size-12 rounded-full bg-white dark:bg-[#2A201C] border border-gray-100 dark:border-[#3D2E28] shadow-sm flex items-center justify-center hover:bg-gray-50 dark:hover:bg-[#352924] transition-colors">
                        <img alt="Google Logo" class="w-5 h-5" data-alt="Google G logo"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuCAqDU6B28XClZHX93_ENoxkvfKe1a4IDXe7_SsBzKrg93fBD4rPUlYPnaFSwXVngIltIxs3RkdhHJ6Hc72lpB1SHA99z9SvUmDsvP810GlmbgEqtW6327Iqy4jbanP58RXmLbzTZdd_Y5ZB-dY7E1mXZQ2_mXH1zX9T4_v0d--vd3Nqr_PR0uhPt10-lq3bUq4uXOvAiVeB2iKuh4XSvRW0DWra8PfnKLfvVbBFpk9p80kZthPtz6G8RZeHzeHHz7VR4hJxniNlHoV" />
                    </button>
                    <button
                        class="size-12 rounded-full bg-white dark:bg-[#2A201C] border border-gray-100 dark:border-[#3D2E28] shadow-sm flex items-center justify-center hover:bg-gray-50 dark:hover:bg-[#352924] transition-colors">
                        <img alt="Apple Logo" class="w-5 h-5 dark:invert" data-alt="Apple fruit logo"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuAUvapCyxgPFX6HkuSZNFZHbqXekvhvmO7U61SqAGr70k2HfWtzUvODoU8aal3m2dCSrXv6to1X7ur0Et85azk80iQ7j8E4HahPL2S-wB5hY_irepE8lGo8z3M_EtEW8D8-LJdgV2BoixcutPe0udz46DPz_6KkJnjIyLrB-Pxw-YzY8pzGvhuDMYWOVfm8N09eKGkrW3BNj6RkZTtW0Pien4BzxpZvdAMIw5MC0LRz0lrO8jtRZ4M2Op3Q1viOiSuXZk44ng-4gUPe" />
                    </button>
                </div>
            </div>
            <!-- Footer -->
            <div class="mt-8 text-center">
                <p class="text-xs text-text-muted dark:text-gray-500">
                    By continuing, you agree to our
                    <a class="font-bold underline decoration-primary/50 hover:text-primary transition-colors"
                        href="#">Terms of Service</a>
                    and
                    <a class="font-bold underline decoration-primary/50 hover:text-primary transition-colors"
                        href="#">Privacy Policy</a>.
                </p>
            </div>
        </div>
    </div>
</body>

</html>
