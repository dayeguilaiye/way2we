name: way2we
description: 一起的小日子，约定、积分与彼此的小卖部。
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.1
  dio: 5.11.1
  flutter_secure_storage: 11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/botanicals/
    - assets/fonts/OFL.txt
  fonts:
    - family: BrandSerif
      fonts:
        - asset: assets/fonts/brand-serif.ttf
