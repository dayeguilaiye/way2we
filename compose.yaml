name: way2we
services:
  db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: way2we
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: way2we_dev
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pg_dev:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U way2we -d way2we_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    environment:
      MP_MAX_MESSAGES: 100
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  db-test:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    profiles: ["test"]
    environment:
      POSTGRES_USER: way2we_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: way2we_test
    ports: ["127.0.0.1:55433:5432"]
    tmpfs: ["/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U way2we_test -d way2we_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pg_dev:
