          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpaceRequest'
  /v1/spaces/{space_id}:
    get:
      operationId: getSpace
      summary: 读取空间
      tags:
      - space
      x-access-rule: space:active-member
      description: 读取空间
      parameters:
      - name: space_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 成功
          headers:
