openapi: 3.1.0
info:
  title: way2we 首轮业务接口
  version: 0.1.0
  description: 阶段 3.2 实施契约；工程规则见 docs/engineering/api.md。所有时间 UTC，错误采用项目 JSON 格式，权限由服务端验证。
servers:
- url: http://127.0.0.1:8080
  description: 本地开发；测试和正式环境配置 HTTPS 地址
security:
- BearerAuth: []
paths:
  /v1/auth/email-codes:
    post:
      operationId: requestEmailCode
      summary: 申请邮箱验证码
      tags:
      - auth
      x-access-rule: auth:public
      description: 统一返回已受理。邮箱按规范化规则处理；每邮箱至少间隔 60 秒。未收到邮件可按间隔重新申请。发送成功不代表已有账号。
      parameters: []
      responses:
        '202':
          description: 成功
          headers:
            X-Request-ID:
              description: 当前请求唯一编号；重放和核对产生新编号。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailCodeAccepted'
        '400':
          $ref: '#/components/responses/Error400'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
  /v1/auth/sessions:
    post:
      operationId: createSession
      summary: 验证邮箱并登录
      tags:
      - auth
      x-access-rule: auth:public
      description: 验证码一次性消费，原子取得或创建账号并签发会话。401 CODE_INVALID_OR_EXPIRED 用于验证码错误、过期或已用尽；此公开接口不会触发客户端会话到期引导。
      parameters: []
      responses:
        '201':
          description: 成功
          headers:
            X-Request-ID:
              description: 当前请求唯一编号；重放和核对产生新编号。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-business-error-codes:
      - CODE_INVALID_OR_EXPIRED
  /v1/auth/session:
    delete:
      operationId: deleteCurrentSession
      summary: 退出当前登录
      tags:
      - auth
      x-access-rule: auth:self
      description: 撤销当前会话。凭据已失效时返回 401，客户端同样完成本机退出。空间成员身份保持原值。
      parameters: []
      responses:
        '204':
          description: 成功
          headers:
            X-Request-ID:
              description: 当前请求唯一编号；重放和核对产生新编号。
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /v1/me:
    get:
      operationId: getMe
      summary: 读取本人资料
      tags:
      - account
      x-access-rule: account:self
      description: 读取本人资料
      parameters: []
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              description: 当前请求唯一编号；重放和核对产生新编号。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
    patch:
      operationId: updateMe
      summary: 更新本人昵称与主题
      tags:
      - account
      x-access-rule: account:self
      description: 更新本人昵称与主题
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              description: 当前请求唯一编号；重放和核对产生新编号。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-idempotency: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
  /v1/spaces:
    get:
      operationId: listMySpaces
      summary: 列出本人参与过的空间
      tags:
      - space
      x-access-rule: space:self-history
      description: 包含 active 与 left 的本人空间摘要；left 仅用于识别及恢复参与，不包含业务内容。
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              description: 当前请求唯一编号；重放和核对产生新编号。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpacePage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
    post:
      operationId: createSpace
      summary: 创建空间并加入
      tags:
      - space
      x-access-rule: space:authenticated
      description: 创建空间并加入
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 成功
          headers:
            X-Request-ID:
              description: 当前请求唯一编号；重放和核对产生新编号。
              schema:
                type: string
