        '503':
          $ref: '#/components/responses/Error503'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque session token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 同一业务意图及重试沿用同一 UUID；改参数或下一笔操作生成新值。
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: 与筛选条件绑定的不透明分页游标。
  responses:
    Error400:
      description: 请求格式无法识别。
      headers:
        X-Request-ID:
          description: 当前请求唯一编号；重放和核对产生新编号。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INVALID_REQUEST
              message: 请求格式无法识别。
              field_errors: []
            request_id: req_example
    Error401:
      description: 请重新登录。
      headers:
        X-Request-ID:
          description: 当前请求唯一编号；重放和核对产生新编号。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: 请重新登录。
              field_errors: []
            request_id: req_example
    Error403:
      description: 当前操作不可用。
      headers:
        X-Request-ID:
          description: 当前请求唯一编号；重放和核对产生新编号。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: 当前操作不可用。
              field_errors: []
            request_id: req_example
    Error404:
      description: 内容不可用。
      headers:
        X-Request-ID:
          description: 当前请求唯一编号；重放和核对产生新编号。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: 内容不可用。
              field_errors: []
            request_id: req_example
    Error409:
      description: 记录状态已变化，请刷新。
      headers:
        X-Request-ID:
          description: 当前请求唯一编号；重放和核对产生新编号。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RESOURCE_STATE_CONFLICT
              message: 记录状态已变化，请刷新。
              field_errors: []
            request_id: req_example
    Error422:
      description: 请检查填写内容。
      headers:
        X-Request-ID:
          description: 当前请求唯一编号；重放和核对产生新编号。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_FAILED
              message: 请检查填写内容。
              field_errors:
              - field: quantity
                code: POSITIVE_INTEGER_REQUIRED
            request_id: req_example
    Error429:
      description: 操作过于频繁，请稍后再试。
      headers:
        X-Request-ID:
          description: 当前请求唯一编号；重放和核对产生新编号。
          schema:
            type: string
        Retry-After:
          description: 再次尝试前需要等待的秒数。
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: 操作过于频繁，请稍后再试。
              field_errors: []
            request_id: req_example
    Error500:
      description: 暂时无法完成，请稍后核对。
      headers:
        X-Request-ID:
          description: 当前请求唯一编号；重放和核对产生新编号。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: 暂时无法完成，请稍后核对。
              field_errors: []
            request_id: req_example
    Error503:
      description: 服务暂时不可用，请稍后核对。
      headers:
        X-Request-ID:
          description: 当前请求唯一编号；重放和核对产生新编号。
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: 服务暂时不可用，请稍后核对。
              field_errors: []
            request_id: req_example
  schemas:
    FieldError:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
      required:
      - field
      - code
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
        message:
          type: string
        field_errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - code
      - message
      - field_errors
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
      required:
      - error
      - request_id
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          minLength: 1
          maxLength: 60
        theme:
          type: string
          enum:
          - apricot
          - celadon
          - rose
        created_at:
          type: string
          format: date-time
          pattern: Z$
      required:
      - id
      - display_name
      - theme
      - created_at
    EmailCodeRequest:
      type: object
      properties:
        email:
